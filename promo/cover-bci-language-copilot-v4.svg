<svg width="2400" height="1350" viewBox="0 0 2400 1350" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">BCI-Language Copilot editorial cover</title>
  <desc id="desc">A dark editorial scientific cover showing EEG P300 signals flowing from a human profile into a language prediction manifold and completed phrase.</desc>
  <defs>
