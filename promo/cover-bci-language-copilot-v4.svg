      <stop stop-color="#040611"/>
      <stop offset=".48" stop-color="#08152B"/>
      <stop offset="1" stop-color="#02030A"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1120 580) rotate(22) scale(900 560)">
      <stop stop-color="#74F3FF" stop-opacity=".42"/>
      <stop offset=".42" stop-color="#7E6CFF" stop-opacity=".20"/>
      <stop offset="1" stop-color="#7E6CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1880 680) rotate(30) scale(520 420)">
      <stop stop-color="#FFC06E" stop-opacity=".38"/>
